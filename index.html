<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Uncoding — المساعد الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F0;
    --sidebar-bg:#F0EEE5;
    --card:#FFFFFF;
    --ink:#3D3929;
    --ink-soft:#6B6455;
    --line:#E3E0D3;
    --accent:#C15F3C;
    --accent-ink:#8C4229;
    --bubble-user:#ECE8DB;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
    overflow:hidden;
  }
  h1,h2,h3{
    font-family:'El Messiri', 'IBM Plex Sans Arabic', sans-serif;
    font-weight:700;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono', monospace; direction:ltr; display:inline-block;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  .app{
    display:flex;
    height:100vh;
    height:100dvh;
  }

  /* ===== SIDEBAR (right side in RTL) ===== */
  .sidebar{
    width:250px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    border-inline-start:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:16px 14px;
    transition:width 0.2s ease, padding 0.2s ease, opacity 0.15s ease;
    overflow:hidden;
  }
  .sidebar.collapsed{
    width:0;
    padding-inline:0;
    border:none;
    opacity:0;
  }
  .sidebar-top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px;
  }
  .logo{
    display:flex; align-items:center; gap:8px;
    font-size:1.05rem; font-weight:700;
    white-space:nowrap;
  }
  .logo .mono{color:var(--accent); font-size:0.9rem;}
  .icon-btn{
    width:34px; height:34px; border-radius:8px;
    background:transparent; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); flex-shrink:0;
  }
  .icon-btn:hover{background:var(--line);}
  .sidebar-nav{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .sidebar-nav a{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:8px;
    color:var(--ink-soft); font-size:0.92rem;
    white-space:nowrap;
  }
  .sidebar-nav a:hover{background:var(--line); color:var(--ink);}
  .sidebar-nav a.active{background:var(--card); color:var(--ink); font-weight:600;}
  .sidebar-nav .ic{width:16px; text-align:center; flex-shrink:0;}
  .sidebar-footer{
    margin-top:auto; padding-top:14px; border-top:1px solid var(--line);
    font-size:0.76rem; color:var(--ink-soft); white-space:nowrap;
  }

  /* Floating reopen button, shown only when sidebar is collapsed */
  .reopen-btn{
    position:fixed; top:16px; inset-inline-end:16px; z-index:30;
    width:38px; height:38px; border-radius:9px;
    background:var(--card); border:1px solid var(--line); cursor:pointer;
    display:none; align-items:center; justify-content:center; color:var(--ink-soft);
    box-shadow:0 1px 4px rgba(61,57,41,0.08);
  }
  .reopen-btn.show{display:flex;}

  /* ===== MAIN CHAT AREA ===== */
  .main{
    flex:1; min-width:0;
    display:flex; flex-direction:column;
    height:100%;
  }
  .main-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; flex-shrink:0;
  }
  .main-top .title{font-size:0.95rem; font-weight:600; color:var(--ink-soft);}

  .chat-scroll{
    flex:1; overflow-y:auto;
    display:flex; flex-direction:column; align-items:center;
    padding:10px 20px 20px;
  }
  .chat-col{width:100%; max-width:720px; display:flex; flex-direction:column; gap:26px;}

  .intro{
    text-align:center; padding:40px 10px 10px;
  }
  .intro .avatar-big{
    width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:1.2rem; font-weight:700; margin:0 auto 18px;
  }
  .intro h1{font-size:1.5rem; margin-bottom:10px;}
  .intro p{color:var(--ink-soft); font-size:0.96rem; max-width:44ch; margin:0 auto;}

  .msg-row{display:flex; gap:12px; align-items:flex-start;}
  .msg-row.user{flex-direction:row-reverse;}
  .msg-row .avatar{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:0.72rem; font-weight:700;
  }
  .msg-row.bot .avatar{background:var(--accent); color:#fff;}
  .msg-row.user .avatar{background:var(--bubble-user); color:var(--ink);}
  .msg{font-size:0.97rem; max-width:80%; padding-top:4px;}
  .msg-row.bot .msg{color:var(--ink); max-width:90%;}
  .msg-row.user .msg{
    background:var(--bubble-user);
    padding:11px 16px; border-radius:16px; border-top-right-radius:4px;
  }
  .msg.pending{color:var(--ink-soft); font-style:italic;}

  .composer-wrap{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center;
    padding:8px 20px 18px;
  }
  .composer{
    width:100%; max-width:720px;
    background:var(--card); border:1px solid var(--line);
    border-radius:22px; box-shadow:0 1px 6px rgba(61,57,41,0.06);
    display:flex; align-items:center; gap:8px;
    padding:8px 8px 8px 18px;
  }
  .composer input{
    flex:1; border:none; outline:none; background:transparent;
    font-size:0.97rem; color:var(--ink); padding:9px 4px;
  }
  .composer input::placeholder{color:#A39C88;}
  .composer button{
    background:var(--accent); color:#fff; border:none;
    width:38px; height:38px; border-radius:50%; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1.05rem;
  }
  .composer button:disabled{opacity:0.35; cursor:default;}
  .limit-note{
    color:var(--ink-soft); font-size:0.74rem; margin-top:10px; text-align:center;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width:820px){
    .sidebar{
      position:fixed; inset-inline-end:0; top:0; bottom:0; z-index:40;
      width:250px; box-shadow:-4px 0 20px rgba(0,0,0,0.12);
    }
    .sidebar.collapsed{width:0; box-shadow:none;}
    .reopen-btn{top:12px;}
    .main-top{padding:12px 16px;}
    .chat-scroll{padding:8px 14px 14px;}
    .composer-wrap{padding:8px 14px 14px;}
    .intro{padding:26px 6px 6px;}
    .intro h1{font-size:1.25rem;}
    .intro p{font-size:0.9rem;}
    .msg{font-size:0.94rem;}
  }

  @media (max-width:480px){
    .composer{padding:6px 6px 6px 14px;}
    .composer input{font-size:0.92rem;}
    .logo{font-size:0.98rem;}
  }
</style>
</head>
<body>

<div class="app">

  <button class="reopen-btn" id="reopenBtn" aria-label="فتح القائمة">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="logo">Uncoding <span class="mono">/ai</span></div>
      <button class="icon-btn" id="collapseBtn" aria-label="طي القائمة">☰</button>
    </div>
    <ul class="sidebar-nav">
      <li><a href="index.html" class="active"><span class="ic">💬</span> المساعد الذكي</a></li>
      <li><a href="about.html#services"><span class="ic">▤</span> الحلول</a></li>
      <li><a href="about.html"><span class="ic">◎</span> من نحن</a></li>
      <li><a href="about.html#contact"><span class="ic">✉</span> تواصل</a></li>
    </ul>
    <div class="sidebar-footer">© 2026 Uncoding<br>حلول برمجية وذكاء اصطناعي</div>
  </aside>

  <div class="main">
    <div class="main-top">
      <span class="title">مساعد Uncoding</span>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-col" id="chatCol">
        <div class="intro" id="intro">
          <div class="avatar-big">U</div>
          <h1>هلا فيك 👋</h1>
          <p>أنا مساعد Uncoding الذكي. اسألني عن خدماتنا، أو جرّب وش نقدر نسوي لشركتك.</p>
        </div>
        <div id="chatBody" style="display:flex; flex-direction:column; gap:26px;"></div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
        <button id="chatSend" aria-label="إرسال">↑</button>
      </div>
      <div class="limit-note mono" id="chatLimitNote">15 رسالة متبقية اليوم</div>
    </div>
  </div>

</div>

<script>
const sidebar = document.getElementById('sidebar');
const collapseBtn = document.getElementById('collapseBtn');
const reopenBtn = document.getElementById('reopenBtn');
const intro = document.getElementById('intro');
const chatBody = document.getElementById('chatBody');
const chatScroll = document.getElementById('chatScroll');
const chatInput = document.getElementById('chatInput');
const chatSend = document.getElementById('chatSend');
const chatLimitNote = document.getElementById('chatLimitNote');

function setSidebar(collapsed){
  sidebar.classList.toggle('collapsed', collapsed);
  reopenBtn.classList.toggle('show', collapsed);
  localStorage.setItem('uncoding_sidebar_collapsed', collapsed ? '1' : '0');
}
collapseBtn.addEventListener('click', () => setSidebar(true));
reopenBtn.addEventListener('click', () => setSidebar(false));
// تذكر آخر حالة، وابدأ مطوي تلقائياً على الجوال
const savedCollapsed = localStorage.getItem('uncoding_sidebar_collapsed');
setSidebar(savedCollapsed === '1' || window.innerWidth <= 820);

const DAILY_LIMIT = 50;

function getTodayKey(){
  return 'uncoding_chat_count_' + new Date().toISOString().slice(0,10);
}
function getRemaining(){
  const used = parseInt(localStorage.getItem(getTodayKey()) || '0', 10);
  return Math.max(0, DAILY_LIMIT - used);
}
function incrementUsage(){
  const key = getTodayKey();
  const used = parseInt(localStorage.getItem(key) || '0', 10);
  localStorage.setItem(key, String(used + 1));
  updateLimitNote();
}
function updateLimitNote(){
  const remaining = getRemaining();
  chatLimitNote.textContent = remaining > 0
    ? `${remaining} رسالة متبقية اليوم`
    : 'وصلت الحد اليومي — جرب بكرة، أو تواصل وياا مباشرة';
  chatSend.disabled = remaining <= 0;
  chatInput.disabled = remaining <= 0;
}

function addMessage(text, sender){
  intro.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'msg-row ' + sender;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = sender === 'user' ? 'أنت' : 'U';

  const msg = document.createElement('div');
  msg.className = 'msg';
  msg.textContent = text;

  row.appendChild(avatar);
  row.appendChild(msg);
  chatBody.appendChild(row);
  chatScroll.scrollTop = chatScroll.scrollHeight;
  return msg;
}

let history = [];

async function sendMessage(){
  const text = chatInput.value.trim();
  if(!text || getRemaining() <= 0) return;

  addMessage(text, 'user');
  history.push({role:'user', content:text});
  chatInput.value = '';
  chatSend.disabled = true;

  const pending = addMessage('...يكتب', 'bot');
  pending.classList.add('pending');

  try{
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });

    if(response.status === 429){
      pending.textContent = 'وصلت الحد اليومي للرسائل. جرب بكرة 🙏';
      pending.classList.remove('pending');
      localStorage.setItem(getTodayKey(), String(DAILY_LIMIT));
      updateLimitNote();
      return;
    }

    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
    const reply = textBlocks.join('\n') || 'عذراً، ما قدرت أرد الحين. جرب مرة ثانية.';
    pending.textContent = reply;
    pending.classList.remove('pending');
    history.push({role:'assistant', content: reply});
    incrementUsage();
  }catch(err){
    pending.textContent = 'صار خطأ بالاتصال. جرب مرة ثانية.';
    pending.classList.remove('pending');
  }finally{
    if(getRemaining() > 0) chatSend.disabled = false;
  }
}

chatSend.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(); });
updateLimitNote();
</script>

</body>
</html>
